name: Docker Hub

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to build
        required: true
        default: v0.4.0
        type: string

permissions:
  contents: read

concurrency:
  group: dockerhub-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Verify published release
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test -n "$DOCKERHUB_USERNAME"
          git merge-base --is-ancestor HEAD origin/master
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq '(.isDraft == false) and (.isPrerelease == false)' | grep -Fx true
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          if test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = "$RELEASE_TAG"; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: huhamhire/air-co2-exporter:${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
      - name: Verify and push native image
        env:
          IMAGE: huhamhire/air-co2-exporter:${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker run --rm "$IMAGE" --help
          docker run --rm "$IMAGE" --version 2>&1 | grep -F "version $VERSION"
          docker push "$IMAGE"

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish and verify multi-platform manifest
        env:
          IMAGE: huhamhire/air-co2-exporter
          VERSION: ${{ needs.prepare.outputs.version }}
          UPDATE_LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          tags=(--tag "$IMAGE:$VERSION")
          if test "$UPDATE_LATEST" = true; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:$VERSION-linux-amd64" "$IMAGE:$VERSION-linux-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw | \
            jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
          if test "$UPDATE_LATEST" = true; then
            test "$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')" = \
              "$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')"
          fi
